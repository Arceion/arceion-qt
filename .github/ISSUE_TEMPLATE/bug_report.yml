name: Bug Report
description: Report a bug or unexpected behavior in Arceion Qt
title: "[Bug]: "
labels: ["bug", "needs-triage"]
assignees: []

body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting a bug! Please provide as much detail as possible to help us reproduce and fix the issue.

  - type: checkboxes
    id: prerequisites
    attributes:
      label: Prerequisites
      description: Please confirm the following before submitting
      options:
        - label: I have searched existing issues to ensure this bug hasn't been reported
          required: true
        - label: I have tested with the latest version of Arceion Qt
          required: true
        - label: I have reviewed the [documentation](https://github.com/Arceion/arceion-qt/wiki)
          required: true

  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear and concise description of what the bug is
      placeholder: Describe the bug clearly and concisely
    validations:
      required: true

  - type: textarea
    id: steps-to-reproduce
    attributes:
      label: Steps to Reproduce
      description: Detailed steps to reproduce the behavior
      placeholder: |
        1. Import 'arceion.qt.core.Window'
        2. Create a Window instance with '...'
        3. Navigate to view '...'
        4. Click on '...'
        5. See error
    validations:
      required: true

  - type: textarea
    id: minimal-code
    attributes:
      label: Minimal Reproducible Example
      description: Provide the smallest code example that reproduces the issue
      placeholder: |
        ```python
        from arceion.qt.core import Window, View
        
        class TestView(View):
            def onCreate(self):
                # Code that triggers the bug
                pass
        
        if __name__ == "__main__":
            import sys
            from PyQt6.QtWidgets import QApplication
            
            app = QApplication(sys.argv)
            window = Window()
            window.navigate(TestView)
            window.show()
            sys.exit(app.exec())
        ```
      render: python
    validations:
      required: true

  - type: textarea
    id: expected-behavior
    attributes:
      label: Expected Behavior
      description: What did you expect to happen?
      placeholder: Describe what you expected to happen
    validations:
      required: true

  - type: textarea
    id: actual-behavior
    attributes:
      label: Actual Behavior
      description: What actually happened?
      placeholder: Describe what actually happened instead
    validations:
      required: true

  - type: textarea
    id: error-logs
    attributes:
      label: Error Logs/Traceback
      description: Include complete error messages and stack traces
      placeholder: |
        Paste the full error output here
        
        Traceback (most recent call last):
          File "example.py", line 10, in <module>
            ...
        Error: ...
      render: shell
    validations:
      required: false

  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots
      description: If applicable, add screenshots to help explain the problem
      placeholder: Drag and drop images here, or paste image URLs
    validations:
      required: false

  - type: input
    id: arceion-version
    attributes:
      label: Arceion Qt Version
      description: Which version of Arceion Qt are you using?
      placeholder: "e.g., 0.1.0"
    validations:
      required: true

  - type: input
    id: python-version
    attributes:
      label: Python Version
      description: Which version of Python are you using?
      placeholder: "e.g., 3.11.5"
    validations:
      required: true

  - type: input
    id: pyqt-version
    attributes:
      label: PyQt6 Version
      description: Which version of PyQt6 are you using?
      placeholder: "e.g., 6.11.0"
    validations:
      required: true

  - type: dropdown
    id: operating-system
    attributes:
      label: Operating System
      description: Which operating system are you using?
      options:
        - Windows 11
        - Windows 10
        - macOS (Apple Silicon)
        - macOS (Intel)
        - Linux (Ubuntu/Debian)
        - Linux (Fedora/RHEL)
        - Linux (Arch)
        - Linux (Other)
        - Other
    validations:
      required: true

  - type: input
    id: os-version
    attributes:
      label: OS Version
      description: Specific OS version (e.g., Windows 11 23H2, macOS 14.2, Ubuntu 22.04)
      placeholder: "e.g., Windows 11 23H2"
    validations:
      required: false

  - type: dropdown
    id: installation-method
    attributes:
      label: Installation Method
      description: How did you install Arceion Qt?
      options:
        - pip
        - uv
        - From source (git clone)
        - Other
    validations:
      required: true

  - type: textarea
    id: environment-info
    attributes:
      label: Environment Information
      description: Additional environment details (optional but helpful)
      placeholder: |
        Output of:
        - pip list | grep -E "(arceion|PyQt6|SQLAlchemy)"
        - python --version
        - Any relevant system information
      render: shell
    validations:
      required: false

  - type: dropdown
    id: component
    attributes:
      label: Component/Module
      description: Which component is affected?
      options:
        - Core (Window/View)
        - API Controller
        - Database/ORM
        - Resources (Icons/Themes)
        - Threading (ThreadPool/Worker)
        - Utilities
        - Contrib/Widgets
        - Signals
        - Other/Unknown
    validations:
      required: false

  - type: dropdown
    id: severity
    attributes:
      label: Severity
      description: How severe is this bug?
      options:
        - Low - Minor issue, workaround exists
        - Medium - Affects functionality, workaround exists
        - High - Major functionality broken, no workaround
        - Critical - Application crashes or data loss
    validations:
      required: true

  - type: textarea
    id: workaround
    attributes:
      label: Workaround
      description: Have you found any workaround for this issue?
      placeholder: Describe any temporary workarounds you've discovered
    validations:
      required: false

  - type: textarea
    id: additional-context
    attributes:
      label: Additional Context
      description: Any other information that might be relevant
      placeholder: |
        - Does this happen consistently or intermittently?
        - Did this work in a previous version?
        - Any related issues or discussions?
        - Configuration files or settings
    validations:
      required: false

  - type: checkboxes
    id: contribution
    attributes:
      label: Contribution
      description: Are you willing to help fix this bug?
      options:
        - label: I'm willing to submit a PR to fix this bug
          required: false
        - label: I can help with testing the fix
          required: false
