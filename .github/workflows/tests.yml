name: Tests
on:
  push:
    branches: [main, dev, prod]
  pull_request:
    branches: [main, dev, prod]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12']
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'

    - name: Install system dependencies (for PyQt6)
      run: |
        sudo apt-get update
        sudo apt-get install -y libxcb-xinerama0 libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-render-util0 libxcb-shape0 libxkbcommon-x11-0 libxcb-xfixes0 libegl1 libgl1-mesa-dev xvfb

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip setuptools wheel
        pip install -e ".[dev]"
        pip install pytest pytest-cov pytest-qt ruff mypy

    - name: Lint with ruff
      run: |
        ruff check arceion/

    - name: Run tests with pytest
      run: |
        # Use xvfb-run for PyQt6 tests
        xvfb-run -a pytest --cov=arceion --cov-report=xml -v
        EXIT_CODE=$?

        # Exit code 5 = no tests collected
        if [ $EXIT_CODE -eq 5 ]; then
          echo "No tests found. Skipping."
          exit 0
        fi
    
        exit $EXIT_CODE

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v4
      with:
        file: ./coverage.xml
        flags: unittests
        name: codecov-umbrella
      continue-on-error: true
