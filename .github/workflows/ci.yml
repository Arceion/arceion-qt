name: CI

on:
  workflow_call:  # Makes this reusable from other workflows
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - '**'

# Cancel in-progress runs when a new workflow with the same group name is triggered
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff

      - name: Check code formatting
        run: |
          ruff format --check arceion/

      - name: Run ruff linter
        run: |
          ruff check arceion/ --output-format=github

  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ['3.10', '3.11', '3.12']
        include:
          # Test on Windows and macOS with latest Python only
          - os: windows-latest
            python-version: '3.12'
          - os: macos-latest
            python-version: '3.12'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libxcb-xinerama0 \
            libxcb-cursor0 \
            libxcb-icccm4 \
            libxcb-image0 \
            libxcb-keysyms1 \
            libxcb-render-util0 \
            libxcb-shape0 \
            libxkbcommon-x11-0 \
            libxcb-xfixes0 \
            libegl1 \
            libgl1-mesa-dev \
            xvfb

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -e ".[dev]"

      - name: Run tests (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          if [ ! -d "tests" ]; then
            echo "No tests directory found. Skipping tests."
            exit 0
          fi

          set +e

          xvfb-run -a python -m pytest \
            --cov=arceion \
            --cov-report=xml \
            --cov-report=term \
            -v

          EXIT_CODE=$?

          # Exit code 5 = no tests collected
          if [ $EXIT_CODE -eq 5 ]; then
            echo "No tests found. Skipping."
            exit 0
          fi

          exit $EXIT_CODE

      - name: Run tests (Windows/macOS)
        if: runner.os != 'Linux'
        shell: bash
        run: |
          if [ ! -d "tests" ]; then
            echo "No tests directory found. Skipping tests."
            exit 0
          fi

          set +e

          python -m pytest \
            --cov=arceion \
            --cov-report=xml \
            --cov-report=term \
            -v

          EXIT_CODE=$?

          # Exit code 5 = no tests collected
          if [ $EXIT_CODE -eq 5 ]; then
            echo "No tests found. Skipping."
            exit 0
          fi

          exit $EXIT_CODE

      - name: Upload coverage to Codecov
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage.xml
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pip install bandit[toml] pip-audit

      - name: Run Bandit security scanner
        run: |
          bandit -r arceion/ -ll

      - name: Check for dependency vulnerabilities
        run: |
          pip-audit --desc

  build:
    name: Build Package
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install build twine

      - name: Build distribution
        run: |
          python -m build

      - name: Check package metadata
        run: |
          twine check dist/*

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist-package
          path: dist/
          retention-days: 7

  # Status check that must pass for PRs to be mergeable
  ci-success:
    name: CI Success
    needs: [lint, test, security, build]
    runs-on: ubuntu-latest
    if: always()
    
    steps:
      - name: Check all jobs status
        run: |
          if [[ "${{ needs.lint.result }}" != "success" ]]; then
            echo "Lint job failed"
            exit 1
          fi
          if [[ "${{ needs.test.result }}" != "success" ]]; then
            echo "Test job failed"
            exit 1
          fi
          if [[ "${{ needs.security.result }}" != "success" ]]; then
            echo "Security job failed"
            exit 1
          fi
          if [[ "${{ needs.build.result }}" != "success" ]]; then
            echo "Build job failed"
            exit 1
          fi
          echo "All CI checks passed!"
