[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "arceion-qt"
version = "0.1.0"
description = "Arceion Qt - A collection of Qt components"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Proprietary"}
authors = [
    {name = "Arceion", email = "arceionllc@gmail.com"}
]
maintainers = [
    {name = "Arceion", email = "arceionllc@gmail.com"}
]
keywords = ["qt", "pyqt", "gui", "framework", "widgets"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: Other/Proprietary License",
    "Natural Language :: English",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "cryptography>=41.0.0",
    "requests>=2.31.0",
    "pytz>=2023.3",
    "icecream>=2.1.0",
    "fontTools>=4.42.0",
    "pyqt6>=6.11.0",
]

[dependency-groups]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "pytest-qt>=4.2.0",
    "ruff>=0.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "pytest-qt>=4.2.0",
    "ruff>=0.1.0",
]

[project.urls]
Homepage = "https://github.com/Arceion/arceion-qt"
Repository = "https://github.com/Arceion/arceion-qt"
Issues = "https://github.com/Arceion/arceion-qt/issues"

[tool.setuptools]
packages = ["arceion", "arceion.qt"]

[tool.setuptools.package-data]
"arceion.qt" = [
    "res/**/*",
    "static/**/*",
]

# Ruff configuration
[tool.ruff]
target-version = "py310"
line-length = 120
indent-width = 4

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "ARG", # flake8-unused-arguments
]
ignore = [
    "E501", "B008", "B904", "ARG002",
    "W191", "E101", "C408"
]
exclude = [
    "demo/*",
    "tests/*",
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401", "F403"]  # Allow unused imports in __init__ files
"demo/**/*.py" = ["ARG", "F401"]  # Relax rules for demo code

[tool.ruff.lint.isort]
known-first-party = ["arceion"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

# Pytest configuration
[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
    "--cov=arceion",
]

# Coverage configuration
[tool.coverage.run]
source = ["arceion"]
omit = [
    "*/tests/*",
    "*/demo/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]
